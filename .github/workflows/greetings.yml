name: Greetings

on:
  pull_request_target:
    types: [opened, reopened]
  issues:
    types: [opened, reopened]

permissions:
  read-all

jobs:
  greet:
    permissions:
      issues: write
      pull-requests: write
    uses: kubestellar/infra/.github/workflows/reusable-greetings.yml@main
    secrets: inherit
