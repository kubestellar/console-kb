name: Mission Content Validation
on:
  pull_request:
    paths:
      - 'fixes/**/*.json'
      - 'fixes/**/*.yaml'
      - 'fixes/**/*.yml'
      - 'runbooks/**/*.json'
      - 'runbooks/**/*.yaml'
      - 'runbooks/**/*.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: cd scripts && npm ci

      - name: Install validation tools
        run: |
          # Install crane for container image validation
          CRANE_VERSION="v0.20.2"
          CRANE_SHA256="c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b"
          CRANE_ARCHIVE="${RUNNER_TEMP}/go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o "$CRANE_ARCHIVE"
          echo "${CRANE_SHA256}  ${CRANE_ARCHIVE}" | sha256sum -c -
          tar xzf "$CRANE_ARCHIVE" -C /usr/local/bin crane
          rm -f "$CRANE_ARCHIVE"
          crane version

      - name: Validate mission content
        run: |
          set -o pipefail
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} -- 'fixes/**/*.json' 'fixes/**/*.yaml' 'fixes/**/*.yml' 2>/dev/null || echo "")
          node scripts/mission-content-validation.mjs "$FILES" | tee mission-content-validation-output.log

      - name: Write mission content validation summary
        if: always()
        run: |
          [ -f mission-content-validation-output.log ] && \
            node scripts/render-ci-step-summary.mjs \
              --event mission-content-validation-summary \
              --title 'Mission Content Validation Summary' \
              < mission-content-validation-output.log >> "$GITHUB_STEP_SUMMARY"
