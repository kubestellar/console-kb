name: Scan Mission Files
on:
  pull_request:
    branches: [master]
    paths:
      - 'fixes/**'
      - 'runbooks/**'
      - 'solutions/**'
  push:
    branches: [master]
    paths:
      - 'fixes/**'
      - '!fixes/index.json'
      - 'runbooks/**'
      - 'solutions/**'
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6:00am UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json
      - name: Install dependencies
        run: cd scripts && npm ci
      - name: Find changed files (PR only)
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          # NUL-delimited to safely handle paths containing whitespace; a
          # newline-joined/tr-flattened list would let a filename with a
          # space or tab bypass the scanner (see #3280).
          git diff --name-only --diff-filter=ACMR -z "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- 'fixes/**/*.json' 'fixes/**/*.yaml' 'fixes/**/*.yml' 'runbooks/**/*.json' 'runbooks/**/*.yaml' 'runbooks/**/*.yml' 'solutions/**/*.json' 'solutions/**/*.yaml' 'solutions/**/*.yml' > changed_files.txt
          echo "count=$(tr -cd '\0' < changed_files.txt | wc -c)" >> "$GITHUB_OUTPUT"
          if [ -s changed_files.txt ] && ! tr '\0' '\n' < changed_files.txt | grep -qv '^solutions/'; then
            echo "only_solutions=true" >> "$GITHUB_OUTPUT"
          else
            echo "only_solutions=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan missions (PR — changed files only)
        if: github.event_name == 'pull_request' && steps.changed.outputs.count != '0'
        continue-on-error: ${{ steps.changed.outputs.only_solutions == 'true' }}
        run: |
          mapfile -d '' -t FILES < changed_files.txt
          node scripts/scan-pr.mjs "${FILES[@]}"
      - name: Write non-blocking solutions scan summary
        if: always() && github.event_name == 'pull_request' && steps.changed.outputs.only_solutions == 'true'
        run: |
          {
            echo "### Non-blocking solutions mission scan"
            echo
            echo "This run touched only solutions/ files, so current generated-content findings are reported but do not fail the job while solutions coverage is introduced."
            if [ -f scan-results.md ]; then
              echo
              cat scan-results.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Scan missions (push/schedule/dispatch — all files)
        if: github.event_name != 'pull_request'
        run: node scripts/scan-pr.mjs --all
      - name: Post results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('scan-results.md')) {
              const body = fs.readFileSync('scan-results.md', 'utf8');
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              } catch (err) {
                core.warning(`Could not post scan results (fork PRs have read-only tokens): ${err.message}`);
              }
            }
