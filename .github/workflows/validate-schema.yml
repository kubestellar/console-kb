name: Validate Mission Schema
on:
  pull_request:
    branches: [master]
    paths:
      - 'fixes/**'
      - 'runbooks/**'
  push:
    branches: [master]
    paths:
      - 'fixes/**'
      - '!fixes/index.json'
      - 'runbooks/**'
  schedule:
    - cron: '30 5 * * 1'  # Weekly Monday 5:30am UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json
        if: github.event_name == 'pull_request'
        run: |
          # NUL-delimited so paths containing whitespace survive to the scanner
          # (same fix pattern as scan-missions.yml, #3280 / #3470).
          git diff --name-only --diff-filter=ACMR -z ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- 'fixes/**/*.json' 'fixes/**/*.yaml' 'fixes/**/*.yml' 'runbooks/**/*.json' 'runbooks/**/*.yaml' 'runbooks/**/*.yml' > changed_files.txt
          echo "count=$(tr -cd '\0' < changed_files.txt | wc -c)" >> $GITHUB_OUTPUT
      - name: Validate schema (PR — changed files only)
        if: github.event_name == 'pull_request' && steps.changed.outputs.count != '0'
        run: |
          set -o pipefail
          mapfile -d '' -t FILES < changed_files.txt
          node scripts/validate-schema.mjs "${FILES[@]}" | tee validate-schema-output.log
      - name: Validate schema (push/schedule/dispatch — all files)
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          node scripts/validate-schema.mjs --all | tee validate-schema-output.log
      - name: Write schema validation summary
        if: always()
        run: |
          # No log means the validation step was skipped (no mission files in
          # the diff) — exit 0 instead of failing the job (bash -e + `[ -f ] &&`).
          if [ -f validate-schema-output.log ]; then
            node scripts/render-ci-step-summary.mjs \
              --event schema-validation-summary \
              --title 'Schema Validation Summary' \
              < validate-schema-output.log >> "$GITHUB_STEP_SUMMARY"
          fi
