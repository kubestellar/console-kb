name: Fuzzing

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: '0 6 * * *' # Daily 06:00 UTC

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz JavaScript parsers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run scanner regression test suite
        id: unit-tests
        working-directory: scripts
        run: npm test
        env:
          NODE_ENV: test

      - name: Property-based testing for JSON schema
        id: json-schema
        if: always()
        run: node scripts/fuzz-json-fixtures.mjs | tee fuzz-json-fixtures-output.log

      - name: Fuzz mission scanner
        id: mission-scanner
        if: always()
        run: node scripts/fuzz-mission-scanner.mjs | tee fuzz-mission-scanner-output.log

      - name: Post fuzz summary
        if: always()
        run: |
          echo "### 🧪 Fuzzing Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "#### Scanner regression test suite" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ steps.unit-tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "#### JSON fixture fuzzing" >> "$GITHUB_STEP_SUMMARY"
          if [ -f fuzz-json-fixtures-output.log ]; then
            node scripts/render-ci-step-summary.mjs < fuzz-json-fixtures-output.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No output captured (step skipped or produced no log)._" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "#### Mission scanner fuzzing" >> "$GITHUB_STEP_SUMMARY"
          if [ -f fuzz-mission-scanner-output.log ]; then
            node scripts/render-ci-step-summary.mjs < fuzz-mission-scanner-output.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No output captured (step skipped or produced no log)._" >> "$GITHUB_STEP_SUMMARY"
          fi
