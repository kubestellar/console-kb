name: Copilot PR Automation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to process
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: copilot-automation-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.sha }}
  cancel-in-progress: true

jobs:
  copilot-automation:
    # Run the shared workflow only for manual dispatch or PRs authored by the
    # exact Copilot agent login; its own identity check is a substring match.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'Copilot'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    uses: kubestellar/infra/.github/workflows/reusable-copilot-automation.yml@220beeeb8dae67e2fd8e89338ada8144609fc6ef  # main
    with:
      pr_number: ${{ github.event.inputs.pr_number || '' }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
