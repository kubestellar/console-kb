# Closes the alert gap documented in docs/slo.md: CodeQL Analysis and
# OpenSSF Scorecard already run on a weekly schedule, and Stale Issues
# runs daily, but nothing alerts if a *scheduled* run itself fails to
# complete. See kubestellar/console-kb#3717 for the tested render helper
# this workflow calls, ported from kubestellar/homebrew-tap's equivalent
# workflow of the same name.
#
# Auto-filed issues are labeled `lifecycle/frozen` in addition to
# `kind/bug` so stale.yml cannot silently auto-close an unresolved
# workflow-failure tracking issue (mirrors homebrew-tap's convention).
name: Open Issue on Scheduled Workflow Failure

on:
  workflow_run:
    workflows:
      - "CodeQL Security Analysis"
      - "OpenSSF Scorecard"
      - "Stale Issues"
      - "Generate CNCF Install Missions"
      - "Generate CNCF Missions"
      - "Generate Platform Install Missions"
    types:
      - completed

permissions: read-all  # default read; writes scoped to job below

jobs:
  open-issue:
    permissions:
      contents: read  # needed: checkout repository for scripts/workflow-failure-notify.mjs
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
      - name: Install scripts dependencies
        working-directory: scripts
        run: npm ci
      - name: Check for existing open issue
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          LABEL="workflow-failure"
          SEARCH_TITLE="Workflow failure: ${WORKFLOW_NAME}"
          export SEARCH_TITLE

          EXISTING=$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --label "$LABEL" \
            --search "in:title \"${SEARCH_TITLE}\"" \
            --json number,title \
            --jq '.[] | select(.title == env.SEARCH_TITLE) | .number' \
          )

          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch failed jobs for comment
        if: steps.check.outputs.exists == 'true'
        id: comment-details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          FAILED_JOBS=$(node scripts/workflow-failure-notify.mjs failed-jobs)
          echo "failed_jobs=${FAILED_JOBS}" >> "$GITHUB_OUTPUT"

      - name: Comment on existing issue
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_JOBS: ${{ steps.comment-details.outputs.failed_jobs }}
        run: |
          BODY_FILE="$GITHUB_WORKSPACE/workflow-failure-comment.md"
          node scripts/workflow-failure-notify.mjs comment-body > "$BODY_FILE"

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file "$BODY_FILE"

          rm -f "$BODY_FILE"

      - name: Ensure label exists
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh label create "workflow-failure" \
            --repo "$REPOSITORY" \
            --description "Automated: scheduled workflow failed" \
            --color "d93f0b" \
            2>/dev/null || true

      - name: Fetch failed job details
        if: steps.check.outputs.exists == 'false'
        id: details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          FAILED_JOBS=$(node scripts/workflow-failure-notify.mjs failed-jobs)
          echo "failed_jobs=${FAILED_JOBS}" >> "$GITHUB_OUTPUT"

      - name: Open new issue
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_FILE: ${{ github.event.workflow_run.path }}
          FAILED_JOBS: ${{ steps.details.outputs.failed_jobs }}
        run: |
          BODY_FILE="$GITHUB_WORKSPACE/workflow-failure-issue.md"
          TITLE="Workflow failure: ${WORKFLOW_NAME}"

          node scripts/workflow-failure-notify.mjs issue-body > "$BODY_FILE"

          gh issue create \
            --repo "$REPOSITORY" \
            --title "$TITLE" \
            --label "workflow-failure,kind/bug,lifecycle/frozen" \
            --body-file "$BODY_FILE"

          rm -f "$BODY_FILE"
