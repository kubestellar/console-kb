name: Scripts Tests

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    name: Run scripts/ unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run tests
        working-directory: scripts
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scripts-coverage
          path: scripts/coverage/
          if-no-files-found: ignore

      - name: Add coverage to step summary
        if: always()
        working-directory: scripts
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Scripts Test Coverage" >> $GITHUB_STEP_SUMMARY
            node -e "const fs = require('fs'); const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json')); const totals = summary.total; console.log('| Metric | Coverage |'); console.log('|--------|----------|'); console.log(\`| Lines | \${totals.lines.pct}% |\`); console.log(\`| Statements | \${totals.statements.pct}% |\`); console.log(\`| Functions | \${totals.functions.pct}% |\`); console.log(\`| Branches | \${totals.branches.pct}% |\`)" >> $GITHUB_STEP_SUMMARY
          fi
