name: Build Mission Index

on:
  push:
    branches: [master]
    paths:
      - 'fixes/**'
      - '!fixes/index.json'
      - 'runbooks/**'
  workflow_dispatch:

permissions:
  contents: read

# Only one Build Mission Index run should push to master at a time. Without
# this, two mission ingests landing close together race each other's
# "Commit and push index" step and the second one's bare `git push` is
# rejected ("fetch first") because the first run's auto-index commit already
# moved master out from under it (see #3189).
concurrency:
  group: build-mission-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-index:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Build mission index
        run: node scripts/build-index.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet fixes/index.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push index
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fixes/index.json
          git commit -s -m "🌱 Auto-update mission index"

          # The concurrency guard above serializes runs of this workflow,
          # but master can still move between another workflow's push and
          # this step (e.g. a human/bot commit unrelated to the index).
          # Retry a few times with a short backoff before giving up, instead
          # of failing outright on the first "fetch first" rejection (#3189).
          #
          # A rejection means master moved, so mission files may now differ
          # from what build-index.mjs saw. Do NOT rebase the already-made
          # commit: that replays a stale fixes/index.json diff onto the new
          # tree and silently drops whatever landed meanwhile (falco-3733 was
          # dropped this way, fixed ad hoc in #3917; see #3918). Instead,
          # reset to the latest master, rebuild the index from that tree, and
          # commit the fresh result. This also avoids rebase conflicts on
          # fixes/index.json when master's copy changed underneath us.
          attempt=1
          max_attempts=5
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "Push rejected (attempt ${attempt}/${max_attempts}); rebuilding index on latest master and retrying..."
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
            git fetch origin master
            git reset --hard origin/master
            node scripts/build-index.mjs
            if git diff --quiet fixes/index.json; then
              echo "fixes/index.json on latest master already matches the rebuilt index; nothing to push."
              exit 0
            fi
            git add fixes/index.json
            git commit -s -m "🌱 Auto-update mission index"
          done

