name: Build Mission Index

on:
  push:
    branches: [master]
    paths:
      - 'fixes/**'
      - '!fixes/index.json'
      - 'runbooks/**'
  workflow_dispatch:

permissions:
  contents: read

# Only one Build Mission Index run should push to master at a time. Without
# this, two mission ingests landing close together race each other's
# "Commit and push index" step and the second one's bare `git push` is
# rejected ("fetch first") because the first run's auto-index commit already
# moved master out from under it (see #3189).
concurrency:
  group: build-mission-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-index:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Build mission index
        run: node scripts/build-index.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet fixes/index.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push index
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The concurrency guard above serializes runs of this workflow,
          # but master can still move between this run's checkout and its
          # push: actions/checkout pins the triggering SHA, so a run queued
          # behind another one starts from a tree that predates the earlier
          # run's auto-index commit, and any other push to master (human or
          # bot) has the same effect. fixes/index.json is a generated file,
          # so rebasing our copy onto a master that also changed it produces
          # a content conflict (#3914). On a "fetch first" rejection, reset
          # to the latest master and regenerate the index from that tree
          # instead, then retry with a short backoff (#3189).
          attempt=1
          max_attempts=5
          while :; do
            git add fixes/index.json
            git commit -s -m "🌱 Auto-update mission index"
            if git push; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "Push rejected (attempt ${attempt}/${max_attempts}); regenerating index on latest master and retrying..."
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
            git fetch origin master
            git reset --hard origin/master
            node scripts/build-index.mjs
            # generatedAt changes on every build; ignore it so a run whose
            # missions are already indexed on master does not push a
            # timestamp-only commit.
            if git diff --quiet -I '"generatedAt":' fixes/index.json; then
              echo "fixes/index.json on latest master already indexes every mission; nothing to push."
              break
            fi
          done

