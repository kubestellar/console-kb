name: Mission Safety Scan
on:
  pull_request:
    paths:
      - 'fixes/**/*.json'
      - 'fixes/**/*.yaml'
      - 'fixes/**/*.yml'
      - 'runbooks/**/*.json'
      - 'runbooks/**/*.yaml'
      - 'runbooks/**/*.yml'

permissions:
  contents: read

jobs:
  safety-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd scripts && npm ci
      - name: Scan for dangerous commands
        run: |
          set -o pipefail
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} -- 'fixes/**/*.json' 'fixes/**/*.yaml' 'fixes/**/*.yml' 'runbooks/**/*.json' 'runbooks/**/*.yaml' 'runbooks/**/*.yml' 2>/dev/null || find fixes runbooks \( -name '*.json' -o -name '*.yaml' -o -name '*.yml' \) -newer .git/index)
          node scripts/mission-safety-scan.mjs "$FILES" | tee mission-safety-scan-output.log
      - name: Write mission safety scan summary
        if: always()
        run: |
          node scripts/render-step-summary.mjs --event mission-safety-scan-summary \
            --title 'Mission Safety Scan Summary' --log mission-safety-scan-output.log \
            >> "$GITHUB_STEP_SUMMARY"
