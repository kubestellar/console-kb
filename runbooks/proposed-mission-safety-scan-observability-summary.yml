# Proposed replacement for the "Scan for dangerous commands" step in
# .github/workflows/mission-safety-scan.yml
#
# Why: mission-safety-scan.yml runs 15 distinct safety checks across changed
# fixes/**/runbooks/** files but only ever emits per-line ::error/::warning
# annotations. There is no aggregate signal (files scanned, error/warning
# totals, per-check breakdown) available without opening every annotation on
# a run, and no machine-parseable output for anyone building CI dashboards or
# scripted triage on top of this workflow. This mirrors the CI-observability
# summary gap already fixed for scan-pr.mjs, validate_formulae.py, and other
# scanners in sibling repos (see docs/slo.md).
#
# This agent's GitHub App installation does not have the `workflows`
# permission required to create or update files under .github/workflows/
# directly (confirmed — a direct push to mission-safety-scan.yml was
# rejected with "refusing to allow a GitHub App to create or update workflow
# ... without `workflows` permission`"). A maintainer with that permission
# can apply this by replacing the existing "Scan for dangerous commands"
# step's `run:` block with the one below.
#
# The added logic:
#   - Counts files scanned, total errors, and total warnings.
#   - Tallies each of the 15 existing checks under a FIXED, bounded set of
#     known check names (never derived from file content or file names, so
#     cardinality cannot grow with scanned input — no unbounded labels).
#   - Emits one grep-friendly MISSION_SAFETY_SCAN_SUMMARY line to the job log.
#   - Writes the same counts as a markdown table to $GITHUB_STEP_SUMMARY
#     (zero-count rows omitted for readability).
#   - Makes NO change to the scan logic itself or its pass/fail exit code —
#     every existing ::error/::warning annotation and the final exit 1 on
#     ERRORS > 0 are preserved verbatim.
#
# No exporter, metrics backend, or external data flow is added — this is a
# bounded, stdout/step-summary-only structured-logging improvement, per
# telemetry agent policy (no backend confirmed for this repository).

- name: Scan for dangerous commands
  run: |
    ERRORS=0
    WARNINGS=0
    FILES_SCANNED=0

    # Bounded, fixed set of check names — never derived from file content,
    # so this label set cannot grow unbounded regardless of scanned input.
    declare -A CHECK_COUNTS=(
      [dangerous_delete_all]=0
      [rm_rf_root_home]=0
      [protected_namespace_delete]=0
      [placeholder_image]=0
      [empty_install_steps]=0
      [curl_pipe_shell_warn]=0
      [force_delete_grace0_warn]=0
      [cla_boilerplate]=0
      [unfilled_pr_template]=0
      [pip_install_kubectl_helm]=0
      [nonexistent_k8s_version]=0
      [latest_tag_warn]=0
      [hardcoded_credential_warn]=0
      [leaked_cloud_hostname]=0
      [deprecated_registry_warn]=0
    )

    # Get changed JSON/YAML files
    FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} -- 'fixes/**/*.json' 'fixes/**/*.yaml' 'fixes/**/*.yml' 2>/dev/null || find fixes -name '*.json' -o -name '*.yaml' -o -name '*.yml' -newer .git/index)

    for f in $FILES; do
      [ -f "$f" ] || continue
      FILES_SCANNED=$((FILES_SCANNED + 1))

      # Check for kubectl delete namespace/all patterns
      if grep -qP 'kubectl delete (namespace|ns|all)\b.*--all' "$f"; then
        echo "::error file=$f::Dangerous: kubectl delete all/namespace --all"
        ERRORS=$((ERRORS + 1))
        CHECK_COUNTS[dangerous_delete_all]=$((CHECK_COUNTS[dangerous_delete_all] + 1))
      fi

      # Check for rm -rf with dangerous paths
      if grep -qP 'rm\s+-rf?\s+(/|/\*|~|\$HOME)' "$f"; then
        echo "::error file=$f::Dangerous: rm -rf with root/home path"
        ERRORS=$((ERRORS + 1))
        CHECK_COUNTS[rm_rf_root_home]=$((CHECK_COUNTS[rm_rf_root_home] + 1))
      fi

      # Check for kubectl delete in protected namespaces
      if grep -qiP 'kubectl delete.*(kube-system|kube-public|kube-node-lease|default)\b' "$f"; then
        echo "::error file=$f::Dangerous: kubectl delete targeting protected namespace"
        ERRORS=$((ERRORS + 1))
        CHECK_COUNTS[protected_namespace_delete]=$((CHECK_COUNTS[protected_namespace_delete] + 1))
      fi

      # Check for placeholder container images (multiple patterns)
      if grep -qP 'registry/org/image:tag|registry/[a-z]|your-docker-registry/' "$f"; then
        echo "::error file=$f::Placeholder container image not replaced"
        ERRORS=$((ERRORS + 1))
        CHECK_COUNTS[placeholder_image]=$((CHECK_COUNTS[placeholder_image] + 1))
      fi

      # Check for empty install steps (no actual commands)
      if MISSION_FILE="$f" python3 -c "
    import json, sys, os
    def load_mission(path):
        with open(path) as fh:
            if path.endswith(('.yaml', '.yml')):
                import yaml
                return yaml.safe_load(fh)
            return json.load(fh)
    try:
      d = load_mission(os.environ['MISSION_FILE'])
      steps = d.get('mission', {}).get('steps', [])
      has_cmd = any('kubectl' in str(s) or 'helm' in str(s) or 'curl' in str(s) or 'apt' in str(s) or 'pip' in str(s) for s in steps)
      if d.get('missionClass') == 'install' and not has_cmd:
        print('empty')
        sys.exit(0)
    except: pass
    sys.exit(1)
    " 2>/dev/null; then
        echo "::error file=$f::Install mission has no actual install commands"
        ERRORS=$((ERRORS + 1))
        CHECK_COUNTS[empty_install_steps]=$((CHECK_COUNTS[empty_install_steps] + 1))
      fi

      # Check for unverified curl|bash from non-official sources
      if grep -qP 'curl.*\|\s*(ba)?sh' "$f"; then
        if ! grep -qP 'curl.*(get\.k3s\.io|aka\.ms/|sdk\.cloud\.google|clis\.cloud\.ibm|ollama\.com|get\.rke2\.io|raw\.githubusercontent\.com|cdn\.porter\.sh|istio\.io|oss\.kubeclipper\.io).*\|\s*(ba)?sh' "$f"; then
          echo "::warning file=$f::curl piped to shell from non-standard source — verify URL is official"
          WARNINGS=$((WARNINGS + 1))
          CHECK_COUNTS[curl_pipe_shell_warn]=$((CHECK_COUNTS[curl_pipe_shell_warn] + 1))
        fi
      fi

      # Check for force delete without grace period
      if grep -q '\-\-force.*grace-period=0' "$f"; then
        echo "::warning file=$f::Force delete with grace-period=0 — ensure this is intentional"
        WARNINGS=$((WARNINGS + 1))
        CHECK_COUNTS[force_delete_grace0_warn]=$((CHECK_COUNTS[force_delete_grace0_warn] + 1))
      fi

      # Detect CLA boilerplate in resolutions
      if grep -qi 'hereby agree to the terms of the CLA\|I hereby agree.*cla' "$f"; then
        echo "::error file=$f::Resolution contains CLA boilerplate instead of actual content"
        ERRORS=$((ERRORS + 1))
        CHECK_COUNTS[cla_boilerplate]=$((CHECK_COUNTS[cla_boilerplate] + 1))
      fi

      # Detect unfilled PR templates in resolutions
      if grep -qP 'What is the problem you.re trying to solve\?|Pre-Submission checklist|Does this PR introduce a user-facing change' "$f"; then
        echo "::error file=$f::Resolution contains unfilled PR template"
        ERRORS=$((ERRORS + 1))
        CHECK_COUNTS[unfilled_pr_template]=$((CHECK_COUNTS[unfilled_pr_template] + 1))
      fi

      # Detect force delete without grace period (extended pattern)
      if grep -qP '\-\-force.*grace-period[= ]*0' "$f"; then
        echo "::warning file=$f::Contains --force --grace-period=0 pattern"
        WARNINGS=$((WARNINGS + 1))
        CHECK_COUNTS[force_delete_grace0_warn]=$((CHECK_COUNTS[force_delete_grace0_warn] + 1))
      fi

      # Detect pip install kubectl/helm (wrong install method)
      if grep -qP 'pip install (kubectl|helm)\b' "$f"; then
        echo "::error file=$f::Uses pip install kubectl/helm — these are not the real tools"
        ERRORS=$((ERRORS + 1))
        CHECK_COUNTS[pip_install_kubectl_helm]=$((CHECK_COUNTS[pip_install_kubectl_helm] + 1))
      fi

      # Detect nonexistent Kubernetes versions (>v1.33)
      if grep -qP 'v1\.(3[4-9]|[4-9][0-9])' "$f"; then
        echo "::error file=$f::References nonexistent Kubernetes version"
        ERRORS=$((ERRORS + 1))
        CHECK_COUNTS[nonexistent_k8s_version]=$((CHECK_COUNTS[nonexistent_k8s_version] + 1))
      fi

      # Detect :latest container image tags in install missions
      if echo "$f" | grep -q 'install'; then
        if grep -qP 'image:.*:latest' "$f"; then
          echo "::warning file=$f::Uses :latest tag — pin to specific version"
          WARNINGS=$((WARNINGS + 1))
          CHECK_COUNTS[latest_tag_warn]=$((CHECK_COUNTS[latest_tag_warn] + 1))
        fi
      fi

      # Detect hardcoded credentials (password/token/secret/apiKey with non-placeholder values)
      if grep -qP '"(password|token|secret|apiKey|api_key|admin_password)":\s*"(?!<[A-Z_]+>|changeme|CHANGE_ME|your-|YOUR_|xxx|placeholder)[^"]{3,}"' "$f"; then
        echo "::warning file=$f::Possible hardcoded credential detected — verify it's a safe example value"
        WARNINGS=$((WARNINGS + 1))
        CHECK_COUNTS[hardcoded_credential_warn]=$((CHECK_COUNTS[hardcoded_credential_warn] + 1))
      fi

      # Detect leaked cloud provider hostnames
      if grep -qP '\b(ip-\d+-\d+-\d+-\d+\.\w+-\w+-\d+\.compute\.internal|ec2-\d+-\d+-\d+-\d+\.\w+\.compute\.amazonaws\.com|compute\.googleapis\.com|\.cloudapp\.azure\.com)\b' "$f"; then
        echo "::error file=$f::Leaked cloud provider hostname detected — must be anonymized"
        ERRORS=$((ERRORS + 1))
        CHECK_COUNTS[leaked_cloud_hostname]=$((CHECK_COUNTS[leaked_cloud_hostname] + 1))
      fi

      # Detect deprecated container registries
      if grep -qP 'k8s\.gcr\.io/' "$f"; then
        echo "::warning file=$f::Uses deprecated k8s.gcr.io registry — should use registry.k8s.io"
        WARNINGS=$((WARNINGS + 1))
        CHECK_COUNTS[deprecated_registry_warn]=$((CHECK_COUNTS[deprecated_registry_warn] + 1))
      fi
    done

    # Bounded, machine-parseable summary line — fixed key set only, no
    # per-file or per-value labels (satisfies no-unbounded-labels rule).
    SUMMARY_LINE="MISSION_SAFETY_SCAN_SUMMARY files_scanned=$FILES_SCANNED errors=$ERRORS warnings=$WARNINGS"
    for key in "${!CHECK_COUNTS[@]}"; do
      SUMMARY_LINE="$SUMMARY_LINE ${key}=${CHECK_COUNTS[$key]}"
    done
    echo "$SUMMARY_LINE"

    {
      echo "## Mission Safety Scan Summary"
      echo ""
      echo "| Metric | Count |"
      echo "|---|---|"
      echo "| Files scanned | $FILES_SCANNED |"
      echo "| Errors | $ERRORS |"
      echo "| Warnings | $WARNINGS |"
      for key in "${!CHECK_COUNTS[@]}"; do
        [ "${CHECK_COUNTS[$key]}" -eq 0 ] && continue
        echo "| $key | ${CHECK_COUNTS[$key]} |"
      done
    } >> "$GITHUB_STEP_SUMMARY"

    if [ $ERRORS -gt 0 ]; then
      echo "::error::Found $ERRORS safety issues. Fix before merging."
      exit 1
    fi
    echo "Safety scan passed"
